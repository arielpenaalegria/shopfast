<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07050f">
<link rel="icon" href="favicon.jpg">
<title>Shop Fast</title>
<style>
:root{--bg:#0b0b0d;--card:#16161a;--card2:#1e1e24;--ink:#f4f4f5;--mut:#a1a1aa;--line:#2a2a31;--pri:#ff7a00;--pri2:#ff4d00;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
header{background:#000;border-bottom:1px solid #ff7a0040;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;border-radius:10px}
.brand b{font-size:1.05rem;letter-spacing:.5px;color:var(--pri);text-transform:uppercase;font-style:italic;font-weight:900}
.brand small{display:block;color:var(--mut);font-size:.72rem;font-weight:500;font-style:normal;text-transform:none;letter-spacing:0}
header a{color:var(--pri)}#who{font-size:.9rem;color:var(--mut)}
main{max-width:960px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:1.05rem}h3{margin:14px 0 8px;font-size:.95rem;color:var(--mut);font-weight:600}
input,select,button,textarea{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#71717a}input:focus,select:focus,textarea:focus{outline:2px solid #ff7a0055;border-color:var(--pri)}
button{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.5}
button.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}button.red{background:#3a1414;color:#fca5a5}button.ghost{background:none;color:var(--pri);padding:6px 8px}
button.sm{padding:7px 10px;font-size:.85rem;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>input,.row>select,.row>textarea{flex:1;min-width:130px}
.mut{color:var(--mut);font-size:.88rem}.hidden{display:none!important}
.msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:.92rem}.ok{background:#052e16;color:#86efac}.err{background:#3a1414;color:#fca5a5}.warn{background:#3b2a06;color:#fcd34d}
.hero{background:linear-gradient(135deg,#ff7a00,#c2410c);border:0;color:#fff}.hero .mut{color:#ffedd5}
.bal{font-size:2.1rem;font-weight:900;letter-spacing:-.5px}.bal small{font-size:1rem;font-weight:700;margin-left:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--pri);border-color:var(--pri)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pkg{background:var(--card2);border:2px solid var(--line);color:var(--ink);text-align:left;padding:12px;border-radius:12px;font-weight:500}
.pkg b{display:block;font-size:1.05rem;margin-top:4px;color:var(--pri)}.pkg.on{border-color:var(--pri);background:#2a1a0d}
.list>div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}.list>div:last-child{border:0}
.list .l{min-width:0;flex:1}.list .l>div:first-child{font-weight:600;overflow-wrap:anywhere}.list .r{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.75rem;font-weight:700}
.tag.completed,.tag.approved,.tag.id{background:#052e16;color:#86efac}.tag.failed,.tag.rejected,.tag.off{background:#3a1414;color:#fca5a5}
.tag.pending,.tag.processing{background:#1e1b4b;color:#c7d2fe}.tag.unknown{background:#3b2a06;color:#fcd34d}.tag.code{background:var(--card2);color:var(--mut)}
details.fam{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
details.fam>summary{padding:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;list-style:none;font-weight:600}
details summary::-webkit-details-marker{display:none}details.fam[open]>summary{background:var(--card2);border-bottom:1px solid var(--line)}
details.fam .body{padding:4px 12px 10px}
.reg{display:flex;align-items:center;gap:12px;width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;text-align:left;font-weight:400}
.code{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:42px;padding:0 10px;border-radius:10px;background:#000;color:var(--pri);border:1px solid #ff7a0055;font-weight:800;letter-spacing:.5px;font-size:.9rem}
.rn{flex:1;display:flex;flex-direction:column;min-width:0}.rn b{font-size:1.02rem}.chev{font-size:1.6rem;color:var(--mut);line-height:1}
details.regd{border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 10px}
details.regd>summary{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;list-style:none}details.regd[open] .chev{transform:rotate(90deg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:var(--card2);border-radius:12px;padding:12px}.stat b{display:block;font-size:1.3rem}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}.bars div{flex:1;background:linear-gradient(var(--pri),var(--pri2));border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars-l{display:flex;gap:4px;font-size:.65rem;color:var(--mut)}.bars-l span{flex:1;text-align:center}
.proof{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.recents{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.login{max-width:380px;margin:30px auto;text-align:center}.login img{width:150px;height:150px;border-radius:24px;margin:0 auto 10px;display:block}
.login input{width:100%;margin-bottom:10px}.login button{width:100%}
/* ===== Mejora de diseño ===== */
:root{--pri3:#ffb066;--shadow:0 8px 24px -12px #000c,0 1px 0 #ffffff08 inset;--ease:cubic-bezier(.2,.7,.2,1)}
html{scroll-behavior:smooth}
body{background:radial-gradient(900px 420px at 85% -120px,#ff7a0024,transparent 70%),radial-gradient(700px 360px at -10% 0,#ff4d0014,transparent 70%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
header{background:#000000cc;backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);padding:10px 16px}
.brand img{box-shadow:0 0 0 1px #ff7a0066,0 6px 18px -6px #ff7a00aa}
main{padding:18px 14px 56px}
.card{background:linear-gradient(180deg,#1a1a1f,var(--card));box-shadow:var(--shadow);border-radius:18px;padding:18px}
h2{font-size:1.1rem;letter-spacing:.2px}
h3{text-transform:uppercase;font-size:.72rem;letter-spacing:.9px;color:#8b8b95;margin:18px 0 9px}
input,select,textarea{transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px #ff7a0033;background:#23232a}
button{transition:transform .12s var(--ease),filter .15s,box-shadow .15s,background .15s,border-color .15s;min-height:42px}
button:not(:disabled):hover{filter:brightness(1.1)}button:not(:disabled):active{transform:scale(.97)}
button:not(.sec):not(.red):not(.ghost):not(.chip):not(.pkg):not(.reg):not(.seg button):not(.clr){box-shadow:0 8px 18px -10px #ff5a00}
button.sm{min-height:34px}button.ghost{min-height:0}
button:focus-visible,summary:focus-visible{outline:2px solid var(--pri3);outline-offset:2px}
button.big{width:100%;font-size:1.05rem;padding:14px}
.row>button{flex:0 0 auto}
.tabs{scrollbar-width:none;gap:8px;padding:2px 2px 6px;margin-bottom:14px}.tabs::-webkit-scrollbar{display:none}
.tabs button{border-radius:999px;padding:9px 16px;background:#16161a;color:#c9c9d1;font-weight:600;min-height:40px}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px #ff5a00}
.chip{transition:all .15s;min-height:40px}.chip:hover{border-color:#ff7a0088}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;box-shadow:0 6px 16px -8px #ff5a00}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff8a1f,#c2410c 70%,#9a3412);box-shadow:0 18px 40px -22px #ff5a00}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#ffffff2e,transparent 65%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.bals>div{background:#00000033;border:1px solid #ffffff14;backdrop-filter:blur(4px)}
.bal{font-size:2.3rem}
/* Selector de tipo de pago (precios independientes) */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.seg button{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i l" "i s";align-items:center;column-gap:10px;text-align:left;background:var(--card2);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:11px 13px;font-weight:600;min-height:58px}
.seg .si{grid-area:i;font-size:1.5rem;line-height:1}.seg .sl{grid-area:l;font-size:.92rem}.seg small{grid-area:s;font-size:.78rem;font-weight:500;color:var(--mut)}
.seg button:hover{border-color:#ff7a0088}
.seg button.on{border-color:var(--pri);background:linear-gradient(135deg,#2e1b0c,#1e1e24);box-shadow:0 0 0 3px #ff7a0022,0 10px 22px -14px #ff7a00}
.seg button.on small{color:var(--pri3)}
.paysum{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#000;border:1px dashed #ff7a0066;border-radius:12px;padding:11px 14px;margin-bottom:10px}
.paysum span{color:var(--mut);font-size:.9rem}.paysum b{font-size:1.1rem;color:var(--pri3)}.paysum.low b{color:#fca5a5}
/* Paquetes */
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pkg{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:88px;border-radius:14px;padding:13px;font-weight:600;transition:transform .15s var(--ease),border-color .15s,box-shadow .15s}
.pkg:hover{transform:translateY(-2px);border-color:#ff7a0088}
.pkg b{font-size:1.15rem;margin:0;color:var(--pri3)}
.pkg.on{border-color:var(--pri);background:linear-gradient(135deg,#33200e,#1e1e24);box-shadow:0 0 0 3px #ff7a0022,0 12px 24px -14px #ff7a00}
/* Buscador con lupa */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:13px 44px 13px 44px;border-radius:14px;background:#101014;font-size:1rem}
.search input::-webkit-search-cancel-button{display:none}
.search .lupa{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:1.05rem;opacity:.75;pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;color:var(--mut);border-radius:50%}
.search input:placeholder-shown~.clr{display:none}
/* Listas y detalles */
.list>div{transition:background .15s;border-radius:8px}
.tag{letter-spacing:.2px}
details.fam,details.regd{background:#ffffff04}
details.fam>summary{padding:14px}
.reg{transition:transform .15s var(--ease),border-color .15s}.reg:hover{transform:translateX(3px);border-color:#ff7a0088}
.code{box-shadow:0 0 0 1px #ff7a0022 inset}
.stat{border:1px solid var(--line);background:linear-gradient(180deg,#22222a,var(--card2))}
.msg{border:1px solid #ffffff10;border-radius:12px}
.login{margin-top:48px;padding:26px 22px}.login img{box-shadow:0 18px 40px -18px #ff7a00}
.card,.msg{animation:rise .25s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:480px){main{padding:14px 10px 48px}.card{padding:15px;border-radius:16px}.bal{font-size:2rem}.grid{grid-template-columns:repeat(2,1fr)}.seg{grid-template-columns:repeat(3,1fr);gap:6px}.seg button{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 4px;min-height:84px}.seg .si{font-size:1.3rem}.seg .sl{font-size:.72rem;line-height:1.15}.seg small{font-size:.68rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ===== Sub-admin / registro ===== */
.chk{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.chk:hover{border-color:#ff7a0088}.chk input{width:20px;height:20px;min-height:0;padding:0;margin-top:2px;accent-color:var(--pri);flex:none}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;font-size:.78rem;color:var(--mut);min-width:120px}
.tag.role-admin{background:#3b2a06;color:#fcd34d}.tag.role-subadmin{background:#1e1b4b;color:#c7d2fe}.tag.role-reseller,.tag.role-visitante{background:var(--card2);color:var(--mut)}
.mut,.list .l,.list .l>div{overflow-wrap:anywhere;word-break:break-word}
main{overflow-x:clip}
/* ===== Orden y organización (v2) ===== */
/* Pestañas siempre a la vista al bajar */
.tabs{position:sticky;top:61px;z-index:4;margin:0 -14px 14px;padding:8px 14px 8px;background:linear-gradient(#0b0b0dee 80%,#0b0b0d00);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* Títulos de sección */
.sect{display:flex;align-items:center;gap:10px;margin:24px 2px 12px;font-size:.74rem;letter-spacing:1px;text-transform:uppercase;color:#8b8b95;font-weight:700}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sect:first-child{margin-top:4px}
/* Tarjeta por revendedor */
.rgrid{display:grid;gap:12px;grid-template-columns:1fr}
.rbox{background:linear-gradient(180deg,#1c1c22,#17171c);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.rbox.off{opacity:.62}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;color:#fff;text-transform:uppercase;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 6px 14px -8px #ff5a00}
.rname{font-weight:700;overflow-wrap:anywhere;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.tile{background:#0f0f13;border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.tile span{display:block;font-size:.68rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{display:block;font-size:1.02rem;margin-top:2px;overflow-wrap:anywhere}
.tile.zero b{color:#71717a;font-weight:600}
.tag.manual{background:#3b2a06;color:#fcd34d}.tag.auto{background:var(--card2);color:var(--mut)}.tag.trust{background:#1e1b4b;color:#c7d2fe}
details.newrev>summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
details.newrev[open]>summary .chev{transform:rotate(90deg)}
.regd .list{padding-bottom:6px}
/* Cupos */
.qrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.85rem;margin:12px 0 6px}
.qrow b{font-size:.95rem}
.meter{height:9px;border-radius:99px;background:#0b0b0d;border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#a3e635);transition:width .3s var(--ease)}
.meter.warn i{background:linear-gradient(90deg,#f59e0b,#fb923c)}.meter.low i{background:linear-gradient(90deg,#ef4444,#f97316)}
/* Ranking */
.rank{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.medal{font-size:1.5rem;text-align:center;line-height:1}.pos{font-weight:800;color:var(--mut);text-align:center}
.rank .bar{height:6px;border-radius:99px;background:#0b0b0d;margin-top:7px;overflow:hidden}.rank .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
/* Ventana para ajustar saldo */
.modal{position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:18px 16px 24px;max-height:92vh;overflow:auto;animation:rise .2s var(--ease) both}
.sheet input{width:100%}
.sheet .row{flex-wrap:nowrap}.sheet .row>button{flex:1}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pm button{background:var(--card2);color:var(--ink);border:2px solid var(--line);box-shadow:none!important}
.pm button.on.plus{border-color:var(--ok);background:#052e16;color:#86efac}.pm button.on.minus{border-color:var(--err);background:#3a1414;color:#fca5a5}
@media (min-width:560px){.modal{align-items:center;padding:16px}.sheet{border-radius:22px}}
@media (min-width:720px){.rgrid{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.tabs{margin:0 -10px 12px;padding:8px 10px}.tile b{font-size:.95rem}}

/* ===== Diseño v3 ===== */
body{background:radial-gradient(900px 500px at 50% -120px,#ff7a0026,transparent 70%),radial-gradient(600px 400px at 100% 100%,#ff4d0014,transparent 70%),var(--bg);background-attachment:fixed}
header{backdrop-filter:blur(14px);background:#0b0b0dcc;position:sticky;top:0;z-index:20}
.login{background:linear-gradient(180deg,#1b1b21,#141418);border:1px solid #ffffff12;border-radius:26px;box-shadow:0 30px 80px -30px #000,0 0 0 1px #ff7a0010,0 -1px 0 #ff7a0033 inset}
.login img{width:112px;height:112px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #ff7a00,0 0 0 8px #ff7a0022,0 18px 44px -14px #ff7a00}
.login h2{font-size:1.5rem;margin:8px 0 2px}
.login .sub{color:var(--mut);font-size:.92rem;margin-bottom:18px}
.login input{padding:14px 16px;border-radius:14px;font-size:1rem}
.login #lb{padding:14px;border-radius:14px;font-size:1rem;font-weight:800;letter-spacing:.2px}
.gbox{display:flex;justify-content:center;min-height:44px;margin-bottom:4px}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:.82rem;margin:14px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.card{border:1px solid #ffffff0f;box-shadow:0 14px 36px -24px #000}
.tabs button{transition:transform .15s,background .15s}.tabs button:active{transform:scale(.96)}
button:not(.ghost):active{transform:scale(.98)}

/* ===== Orden del panel del revendedor ===== */
.heroh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.heroh>span{font-weight:700;color:#ffedd5}
.bal3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bal3>div{background:#00000038;border:1px solid #ffffff1a;border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.bal3 span{display:block;font-size:.72rem;color:#ffedd5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal3 b{display:block;font-size:1.2rem;margin-top:3px;overflow-wrap:anywhere}.bal3 small{font-size:.66rem;color:#ffedd5;opacity:.85;letter-spacing:.5px}
.tabs4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible}
.tabs4 button{padding:10px 2px;font-size:.8rem;white-space:nowrap;border-radius:14px}
.ann{background:#3b2a06;color:#fcd34d;border:1px solid #ffffff10;border-radius:12px;margin:0 0 12px}
.ann summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;font-size:.92rem}
